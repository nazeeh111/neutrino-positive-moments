name: Exact research checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  exact-proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify the published file manifest
        run: python3 -B -O verify_bundle.py
      - name: Replay original exact and continuous-baseline certificates
        run: |
          python3 -B -O verify_all.py
          python3 -B -O independent_continuous_replay.py
          python3 -B -O verify_m2_screen.py
      - name: Check the global and complete finite-band theorems
        run: |
          python3 -B -O offaxis-independent.py
          python3 -B -O finite-k-cap-checks.py
          python3 -B -O test_finite_band_envelope.py
          python3 -B -O independent_full_band_check.py
          python3 -B -O test_moment_precision.py
      - name: Check the nonaxial projection-loss example
        run: python3 -B -O nonaxial-exploration/exact_projection_counterexample.py
      - name: Check the nonaxial first-variation certificate
        run: python3 -B -O nonaxial-exploration/exact_tangent_certificate.py
      - name: Check the nonaxial purely imaginary growth cap
        run: python3 -B -O nonaxial-exploration/exact_nonaxial_imaginary_bound.py
      - name: Check the sharp full-frequency nonaxial cap
        run: python3 -B -O nonaxial-exploration/exact_nonaxial_full_bound.py
      - name: Check the indistinguishable maximum-growth interval
        run: python3 -B -O usefulness-assessment/exact_growth_range.py
      - name: Check the general 3D moment exclusion certificate
        run: python3 -B -O nonaxial-exploration/check_general_moment_certificate.py
      - name: Check rational-frequency certificates and standalone verification
        run: |
          python3 -B -O nonaxial-exploration/test_general_frequency_certificate.py
          python3 -B -O nonaxial-exploration/verify_general_frequency.py examples/nonaxial-general-frequency-input.json examples/nonaxial-general-frequency-result.json
      - name: Check the strongest-cap isotropic comparison
        run: python3 -B -O usefulness-assessment/compare_bounds.py
      - name: Check conditional scalar-closure equivalence
        run: python3 -B -O usefulness-assessment/closure_equivalence.py
      - name: Check the restricted reconstruction covariance example
        run: python3 -B -O usefulness-assessment/reconstruction_covariance.py
      - name: Check exact moment algebra
        run: python3 -B -O -m unittest -v test_independent_verifier test_sharp_envelope test_second_moment_bounds test_independent_m2_locus
