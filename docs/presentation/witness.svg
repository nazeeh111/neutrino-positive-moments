<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc"><title id="title">An upper bound, with its witness</title><desc id="desc">Both positive species have mass 1, zero axial flux and second number moment 1/3. The plus species places weights 1/4 at u = -1 and 3/4 at u = 1/3; the minus species reflects it. At reduced wave number 1/1000, the original longitudinal factor vanishes exactly at imaginary frequency with squared growth 1333/3000000. Horizontal position is angular cosine u; stem height is atom weight on a common zero to one scale. This is one attainable completion, not a prediction for an actual background.</desc><rect width="1080" height="620" fill="#f8f5ed"/><text x="36" y="29" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#183344" text-anchor="start">NEUTRINO POSITIVE MOMENTS / EXACT WITNESS</text><text x="36" y="72" font-family="Arial, Helvetica, sans-serif" font-size="39" fill="#183344" text-anchor="start">An upper bound, with its witness.</text><text x="36" y="115" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#183344" text-anchor="start">N = 1     Q = 1/3     K = 1/1000</text><text x="41" y="176" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#275e67" text-anchor="start">μ+ / positive species</text><line x1="65" y1="301.0" x2="565" y2="301.0" stroke="#bfc7c4" stroke-width="1"/><text x="52" y="305.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#66716e" text-anchor="end">0</text><line x1="65" y1="205.0" x2="565" y2="205.0" stroke="#e4e3db" stroke-width="1"/><text x="52" y="209.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#66716e" text-anchor="end">1</text><line x1="65.0" y1="301" x2="65.0" y2="306" stroke="#c9cec9" stroke-width="1"/><text x="65.0" y="323" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#66716e" text-anchor="middle">-1</text><line x1="315.0" y1="301" x2="315.0" y2="306" stroke="#c9cec9" stroke-width="1"/><text x="315.0" y="323" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#66716e" text-anchor="middle">0</text><line x1="565.0" y1="301" x2="565.0" y2="306" stroke="#c9cec9" stroke-width="1"/><text x="565.0" y="323" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#66716e" text-anchor="middle">1</text><line data-species="plus" data-u="-1" data-weight="1/4" x1="65.0000000000" x2="65.0000000000" y1="301" y2="277.0000000000" stroke="#275e67" stroke-width="5"/><circle cx="65.0" cy="277.0" r="4" fill="#275e67"/><text x="65.0" y="264.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#275e67" text-anchor="middle">1/4</text><line data-species="plus" data-u="1/3" data-weight="3/4" x1="398.3333333333" x2="398.3333333333" y1="301" y2="229.0000000000" stroke="#275e67" stroke-width="5"/><circle cx="398.3333333333333" cy="229.0" r="4" fill="#275e67"/><text x="398.3333333333333" y="216.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#275e67" text-anchor="middle">3/4</text><text x="398.3333333333333" y="323" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#275e67" text-anchor="middle">1/3</text><text x="315.0" y="346" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#66716e" text-anchor="middle">angular cosine u</text><text x="41" y="353" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#aa4e32" text-anchor="start">μ− / positive species</text><line x1="65" y1="478.0" x2="565" y2="478.0" stroke="#bfc7c4" stroke-width="1"/><text x="52" y="482.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#66716e" text-anchor="end">0</text><line x1="65" y1="382.0" x2="565" y2="382.0" stroke="#e4e3db" stroke-width="1"/><text x="52" y="386.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#66716e" text-anchor="end">1</text><line x1="65.0" y1="478" x2="65.0" y2="483" stroke="#c9cec9" stroke-width="1"/><text x="65.0" y="500" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#66716e" text-anchor="middle">-1</text><line x1="315.0" y1="478" x2="315.0" y2="483" stroke="#c9cec9" stroke-width="1"/><text x="315.0" y="500" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#66716e" text-anchor="middle">0</text><line x1="565.0" y1="478" x2="565.0" y2="483" stroke="#c9cec9" stroke-width="1"/><text x="565.0" y="500" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#66716e" text-anchor="middle">1</text><line data-species="minus" data-u="-1/3" data-weight="3/4" x1="231.6666666667" x2="231.6666666667" y1="478" y2="406.0000000000" stroke="#aa4e32" stroke-width="5"/><circle cx="231.66666666666666" cy="406.0" r="4" fill="#aa4e32"/><text x="231.66666666666666" y="393.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#aa4e32" text-anchor="middle">3/4</text><text x="231.66666666666666" y="500" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#aa4e32" text-anchor="middle">-1/3</text><line data-species="minus" data-u="1" data-weight="1/4" x1="565.0000000000" x2="565.0000000000" y1="478" y2="454.0000000000" stroke="#aa4e32" stroke-width="5"/><circle cx="565.0" cy="454.0" r="4" fill="#aa4e32"/><text x="565.0" y="441.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#aa4e32" text-anchor="middle">1/4</text><text x="315.0" y="523" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#66716e" text-anchor="middle">angular cosine u</text><text x="664" y="206" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#66716e" text-anchor="start">SAME SUPPLIED MOMENTS</text><text x="664" y="237" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#183344" text-anchor="start">(mass, flux, second) = (1, 0, 1/3)</text><text x="664" y="288" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#66716e" text-anchor="start">EXACT ATTAINING MODE</text><text x="664" y="322" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#183344" text-anchor="start">γ² = 1333 / 3000000</text><text x="664" y="351" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#183344" text-anchor="start">D_L = 0, checked in the original factor.</text><text x="664" y="385" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#183344" text-anchor="start">Positive weights. Exact rational arithmetic.</text><text x="36" y="565" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#183344" text-anchor="start">One compatible completion. Not universal instability.</text><text x="36" y="588" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#183344" text-anchor="start">Reduced, dimensionless units; no physical wavelength assigned.</text></svg>