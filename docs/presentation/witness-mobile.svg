<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 375 900" role="img" aria-labelledby="title desc"><title id="title">An upper bound, with its witness</title><desc id="desc">Both positive species have mass 1, zero axial flux and second number moment 1/3. The plus species places weights 1/4 at u = -1 and 3/4 at u = 1/3; the minus species reflects it. At reduced wave number 1/1000, the original longitudinal factor vanishes exactly at imaginary frequency with squared growth 1333/3000000. Horizontal position is angular cosine u; stem height is atom weight on a common zero to one scale. This is one attainable completion, not a prediction for an actual background.</desc><rect width="375" height="900" fill="#f8f5ed"/><text x="24" y="29" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#183344" text-anchor="start">NEUTRINO POSITIVE MOMENTS / EXACT WITNESS</text><text x="24" y="72" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#183344" text-anchor="start">An upper bound,</text><text x="24" y="106" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#183344" text-anchor="start">with its witness.</text><text x="24" y="161" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#183344" text-anchor="start">N = 1     Q = 1/3     K = 1/1000</text><text x="24" y="204" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#275e67" text-anchor="start">μ+ / positive species</text><line x1="48" y1="329.0" x2="327" y2="329.0" stroke="#bfc7c4" stroke-width="1"/><text x="35" y="333.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#66716e" text-anchor="end">0</text><line x1="48" y1="233.0" x2="327" y2="233.0" stroke="#e4e3db" stroke-width="1"/><text x="35" y="237.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#66716e" text-anchor="end">1</text><line x1="48.0" y1="329" x2="48.0" y2="334" stroke="#c9cec9" stroke-width="1"/><text x="48.0" y="351" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#66716e" text-anchor="middle">-1</text><line x1="187.5" y1="329" x2="187.5" y2="334" stroke="#c9cec9" stroke-width="1"/><text x="187.5" y="351" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#66716e" text-anchor="middle">0</text><line x1="327.0" y1="329" x2="327.0" y2="334" stroke="#c9cec9" stroke-width="1"/><text x="327.0" y="351" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#66716e" text-anchor="middle">1</text><line data-species="plus" data-u="-1" data-weight="1/4" x1="48.0000000000" x2="48.0000000000" y1="329" y2="305.0000000000" stroke="#275e67" stroke-width="5"/><circle cx="48.0" cy="305.0" r="4" fill="#275e67"/><text x="48.0" y="292.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#275e67" text-anchor="middle">1/4</text><line data-species="plus" data-u="1/3" data-weight="3/4" x1="234.0000000000" x2="234.0000000000" y1="329" y2="257.0000000000" stroke="#275e67" stroke-width="5"/><circle cx="234.0" cy="257.0" r="4" fill="#275e67"/><text x="234.0" y="244.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#275e67" text-anchor="middle">3/4</text><text x="234.0" y="351" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#275e67" text-anchor="middle">1/3</text><text x="187.5" y="374" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#66716e" text-anchor="middle">angular cosine u</text><text x="24" y="406" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#aa4e32" text-anchor="start">μ− / positive species</text><line x1="48" y1="531.0" x2="327" y2="531.0" stroke="#bfc7c4" stroke-width="1"/><text x="35" y="535.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#66716e" text-anchor="end">0</text><line x1="48" y1="435.0" x2="327" y2="435.0" stroke="#e4e3db" stroke-width="1"/><text x="35" y="439.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#66716e" text-anchor="end">1</text><line x1="48.0" y1="531" x2="48.0" y2="536" stroke="#c9cec9" stroke-width="1"/><text x="48.0" y="553" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#66716e" text-anchor="middle">-1</text><line x1="187.5" y1="531" x2="187.5" y2="536" stroke="#c9cec9" stroke-width="1"/><text x="187.5" y="553" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#66716e" text-anchor="middle">0</text><line x1="327.0" y1="531" x2="327.0" y2="536" stroke="#c9cec9" stroke-width="1"/><text x="327.0" y="553" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#66716e" text-anchor="middle">1</text><line data-species="minus" data-u="-1/3" data-weight="3/4" x1="141.0000000000" x2="141.0000000000" y1="531" y2="459.0000000000" stroke="#aa4e32" stroke-width="5"/><circle cx="141.0" cy="459.0" r="4" fill="#aa4e32"/><text x="141.0" y="446.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#aa4e32" text-anchor="middle">3/4</text><text x="141.0" y="553" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#aa4e32" text-anchor="middle">-1/3</text><line data-species="minus" data-u="1" data-weight="1/4" x1="327.0000000000" x2="327.0000000000" y1="531" y2="507.0000000000" stroke="#aa4e32" stroke-width="5"/><circle cx="327.0" cy="507.0" r="4" fill="#aa4e32"/><text x="327.0" y="494.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#aa4e32" text-anchor="middle">1/4</text><text x="187.5" y="576" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#66716e" text-anchor="middle">angular cosine u</text><text x="24" y="634" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#66716e" text-anchor="start">SAME SUPPLIED MOMENTS</text><text x="24" y="665" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#183344" text-anchor="start">(mass, flux, second) = (1, 0, 1/3)</text><text x="24" y="716" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#66716e" text-anchor="start">EXACT ATTAINING MODE</text><text x="24" y="750" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#183344" text-anchor="start">γ² = 1333 / 3000000</text><text x="24" y="779" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#183344" text-anchor="start">D_L = 0, checked in the original factor.</text><text x="24" y="813" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#183344" text-anchor="start">Positive weights. Exact rational arithmetic.</text><text x="24" y="850" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#183344" text-anchor="start">One compatible completion. Not universal instability.</text><text x="24" y="873" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#183344" text-anchor="start">Reduced, dimensionless units; no physical wavelength assigned.</text></svg>